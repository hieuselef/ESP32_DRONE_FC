[platformio]
default_envs = bench_kalman_z_imu

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_eol = LF
upload_speed = 460800
lib_deps =
    rfetick/MPU6050_light @ ^1.1.0
    https://github.com/AlfredoSystems/AlfredoCRSF.git

; Default BENCH: safe for code inspection and diagnostics (no ESC output).
[env:bench]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=0
    -DFC_ALT_V2_AUTHORITY=1

; EXPERIMENTAL: OneShot125 pulses and ANGLE/ALT motor mix.
; DO NOT SELECT before verification of pins, rotation, ESC protocol, PID, RC failsafe.
; This is NOT the already flight-proven esp-fc firmware.
[env:flight_candidate]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=1
    -DFC_ALT_V2_AUTHORITY=0

; Explicitly experimental V2 low-throttle-in-ALT semantics; no flight qualification.
; Props OFF, ESC protocol/pins/failsafe verification mandatory.
[env:flight_alt_v2_candidate]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=1
    -DFC_ALT_V2_AUTHORITY=1

; MPU6050 acceleration fusion + lidar Kalman, BENCH only (ESC OFF).
[env:bench_kalman_z_imu]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=0
    -DFC_ALT_V2_AUTHORITY=1
    -DFC_ALT_KALMAN_ACTUATION=1
    -DFC_ALT_KALMAN_IMU_FUSION=1
    -DFC_POS_ACTUATION=0

; EXPERIMENTAL: fused Kalman can influence ALT throttle and ESC only under
; independent safety gates. NOT FLIGHT VALIDATED. PROPS REMOVED for testing.
[env:flight_alt_kalman_z_imu_candidate]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=1
    -DFC_ALT_V2_AUTHORITY=1
    -DFC_ALT_KALMAN_ACTUATION=1
    -DFC_ALT_KALMAN_IMU_FUSION=1
    -DFC_POS_ACTUATION=0

; POS HOLD path is integrated in V2 but locked (FC_POS_ACTUATION=0 by default).
; Never add -DFC_POS_ACTUATION=1 until independent XY / gyro rotation / sign
; verification and on-airframe failsafe review; config.h static_assert blocks it.

; SAFE KF diagnosis: code gate on, ESC motor outputs OFF.
[env:bench_kalman_z]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=0
    -DFC_ALT_V2_AUTHORITY=1
    -DFC_ALT_KALMAN_ACTUATION=1

; EXPERIMENTAL motor authority: not qualified for flight.
; Select ONLY after bench, tethered spin (PROPS REMOVED) and failure-injection checks.
; Do not mistake this for the flight-tested open-source FC.
[env:flight_alt_kalman_z_candidate]
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DFC_FLIGHT_CANDIDATE=1
    -DFC_ALT_V2_AUTHORITY=1
    -DFC_ALT_KALMAN_ACTUATION=1
    -DFC_POS_ACTUATION=0
